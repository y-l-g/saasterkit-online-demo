name: Create and publish a Docker image
on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_STRIPE_PRICE_PRO_MONTH=${{ secrets.STRIPE_PRICE_PRO_MONTH }}
            VITE_STRIPE_PRICE_PRO_YEAR=${{ secrets.STRIPE_PRICE_PRO_YEAR }}
            VITE_STRIPE_PRICE_PREMIUM_MONTH=${{ secrets.STRIPE_PRICE_PREMIUM_MONTH }}
            VITE_STRIPE_PRICE_PREMIUM_YEAR=${{ secrets.STRIPE_PRICE_PREMIUM_YEAR }}
            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}
  publish-manifest:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}-arm64"
